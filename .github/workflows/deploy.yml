name: Deploy GitHub Pages
run-name: Publish site from ${{ github.ref_name }}

# Start with explicit releases. Enable push deployment after the first live review.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      site_base: ${{ steps.pages.outputs.base_path }}/
      site_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - name: Require the default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo '::error::Run this workflow from the repository default branch.'
          exit 1
      - name: Read the actual Pages URL
        id: pages
        uses: actions/configure-pages@v6

  checks:
    needs: configure
    uses: ./.github/workflows/check.yml
    with:
      site_base: ${{ needs.configure.outputs.site_base }}
      site_url: ${{ needs.configure.outputs.site_url }}

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@v5
